<!-- ===== ERAWAT SCROLL BANNER: paste where your current banner/hero is (keep your own navbar) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
.eb{position:relative;height:380vh;background:#09090b;color:#fff;font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
.eb *{box-sizing:border-box}
.eb-pin{position:sticky;top:0;height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#5a0f14 0%,#09090b 62%)}
.eb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.eb-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.72) 100%),linear-gradient(rgba(0,0,0,.45),transparent 28%,transparent 70%,rgba(0,0,0,.55))}
.eb-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8vw;will-change:opacity,transform}
.eb-slide.two{align-items:flex-start;text-align:left;opacity:0;padding-left:9vw}
.eb-chip{display:inline-block;background:#e0302f;color:#fff;font-weight:800;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding:7px 22px 7px 14px;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%);margin-bottom:20px}
.eb h1,.eb h2{margin:0;font-weight:800;font-size:clamp(2.6rem,5.6vw,5.4rem);line-height:1.04;letter-spacing:-.02em;text-shadow:0 6px 40px rgba(0,0,0,.55)}
.eb-sub{margin:18px 0 28px;font-size:clamp(1.05rem,1.6vw,1.45rem);color:#e9e9ee}
.eb-btn{display:inline-block;padding:18px 44px;border-radius:99px;border:0;background:linear-gradient(90deg,#c9191f,#f4571f);color:#fff;font:inherit;font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:.95rem;cursor:pointer;text-decoration:none;box-shadow:0 14px 40px rgba(220,50,30,.4);transition:transform .25s,box-shadow .25s}
.eb-btn:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(220,50,30,.55)}
.eb .in>*{opacity:0;translate:0 34px;animation:ebIn .9s cubic-bezier(.2,.8,.2,1) forwards}
.eb .in>*:nth-child(2){animation-delay:.12s}.eb .in>*:nth-child(3){animation-delay:.24s}.eb .in>*:nth-child(4){animation-delay:.36s}
@keyframes ebIn{to{opacity:1;translate:0 0}}
.eb-arrow{position:absolute;top:50%;translate:0 -50%;width:56px;height:56px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:rgba(0,0,0,.25);color:#fff;display:grid;place-items:center;cursor:pointer;z-index:3;transition:background .25s}
.eb-arrow:hover{background:rgba(255,255,255,.22)}.eb-arrow.l{left:3.5vw}.eb-arrow.r{right:3.5vw}
.eb-dots{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));translate:-50% 0;display:flex;gap:8px;z-index:3}
.eb-dots i{width:9px;height:9px;border-radius:9px;background:rgba(255,255,255,.45);transition:width .4s,background .4s}.eb-dots i.on{width:26px;background:#fff}
.eb-mouse{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));translate:-50% 0;width:28px;height:46px;border:1.5px solid rgba(255,255,255,.8);border-radius:20px;z-index:3;transition:opacity .4s}
.eb-mouse::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:4px;background:#fff;animation:ebM 1.6s infinite}
@keyframes ebM{0%{opacity:1;translate:0 0}80%{opacity:0;translate:0 16px}100%{opacity:0}}
.eb-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(90deg,#c9191f,#f4571f);z-index:3}
@media (max-width:800px){.eb-arrow{display:none}.eb-slide.two{justify-content:flex-end;padding-bottom:20vh}.eb-dots{bottom:90px}}
@media (prefers-reduced-motion:reduce){.eb .in>*{animation:none;opacity:1;translate:none}.eb-mouse::after{animation:none}}
</style>
<section class="eb" id="eb" aria-label="Erawat banner">
 <div class="eb-pin">
  <canvas id="eb-gl" aria-hidden="true"></canvas>
  <div class="eb-vig"></div>
  <div class="eb-slide one" id="eb-s1"><div class="in" style="display:flex;flex-direction:column;align-items:center">
   <span class="eb-chip">Empty Capsules Specialist</span>
   <h1>Empty Hard Capsules</h1>
   <p class="eb-sub">Gelatin &amp; HPMC/Veg Capsule</p>
   <a class="eb-btn" href="#manufacturingSection">Know more</a></div></div>
  <div class="eb-slide two" id="eb-s2">
   <span class="eb-chip">Global Pharma Supply</span>
   <h2>Opens clean.<br>Ships worldwide.</h2>
   <p class="eb-sub">Gelatin &amp; HPMC/Veg Capsule, filled with the<br>yield your machines are built for.</p>
   <a class="eb-btn" href="#getStartedSection">Send inquiry →</a>
  </div>
  <button class="eb-arrow l" id="eb-l" aria-label="Previous slide"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
  <button class="eb-arrow r" id="eb-r" aria-label="Next slide"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <div class="eb-dots"><i class="on"></i><i></i></div>
  <div class="eb-mouse" id="eb-m"></div>
  <div class="eb-bar" id="eb-bar"></div>
 </div>
</section>
<script>
(function(){
var sec=document.getElementById('eb'),cv=document.getElementById('eb-gl'),s1=document.getElementById('eb-s1'),s2=document.getElementById('eb-s2'),dots=sec.querySelectorAll('.eb-dots i'),mouse=document.getElementById('eb-m'),bar=document.getElementById('eb-bar');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,R,S,C,fw,fr,hero,ha,hb,pel,fd=[],pd=[],dm,dm2,flip,W=1,H=1,mx=0,my=0,run=false,ready=false,loading=false,sm=0;
function L(a,b,t){return a+(b-a)*t}function ss(t){t=Math.min(1,Math.max(0,t));return t*t*(3-2*t)}
function prog(){var r=sec.getBoundingClientRect();return Math.min(1,Math.max(0,-r.top/Math.max(1,r.height-innerHeight)))}
/* text + UI driven by scroll */
function ui(){
var p=prog(),a=1-ss((p-.1)/.16);
s1.style.opacity=a;s1.style.transform='scale('+(1+ss(p/.3)*.7)+')';s1.style.pointerEvents=a<.3?'none':'auto';
var b=ss((p-.62)/.12);s2.style.opacity=b;s2.style.translate='0 '+((1-b)*40)+'px';s2.style.pointerEvents=b<.3?'none':'auto';
dots[0].classList.toggle('on',p<.45);dots[1].classList.toggle('on',p>=.45);
mouse.style.opacity=p>.03?0:1;bar.style.transform='scaleX('+p+')';
}
function go(f){var top=sec.getBoundingClientRect().top+scrollY,max=sec.offsetHeight-innerHeight;scrollTo({top:top+max*f,behavior:reduce?'auto':'smooth'})}
document.getElementById('eb-r').onclick=function(){go(.88)};document.getElementById('eb-l').onclick=function(){go(0)};
/* 3D */
function init(){
try{R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});}catch(e){return}
R.setPixelRatio(Math.min(devicePixelRatio,2));
S=new THREE.Scene();S.fog=new THREE.Fog(0x09090b,12,46);C=new THREE.PerspectiveCamera(36,1,.1,80);
S.add(new THREE.HemisphereLight(0xffffff,0x330808,.75));
var k1=new THREE.DirectionalLight(0xffffff,1.5);k1.position.set(4,6,8);S.add(k1);
var k2=new THREE.PointLight(0xff3a22,2.2,40);k2.position.set(-6,-3,2);S.add(k2);
var pts=[new THREE.Vector2(0,0),new THREE.Vector2(.6,0),new THREE.Vector2(.6,1.1)];for(var i=1;i<=14;i++){var a=i/14*Math.PI/2;pts.push(new THREE.Vector2(.6*Math.cos(a),1.1+.6*Math.sin(a)))}
var geo=new THREE.LatheGeometry(pts,40),M=function(c){return new THREE.MeshStandardMaterial({color:c,roughness:.38,metalness:.05,side:THREE.DoubleSide})};
var FN=64;fw=new THREE.InstancedMesh(geo,M(0xdadade),FN);fr=new THREE.InstancedMesh(geo,M(0xb5151b),FN);S.add(fw,fr);
for(i=0;i<FN;i++)fd.push({x:(Math.random()-.5)*30,y:(Math.random()-.5)*16,z:-36+Math.random()*42,s:.8+Math.random()*1.1,rx:Math.random()*6,ry:Math.random()*6,rz:Math.random()*6,sp:(Math.random()-.5)*.6});
dm=new THREE.Object3D();dm2=new THREE.Object3D();flip=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),Math.PI);
function hm(c){return new THREE.MeshPhysicalMaterial({color:c,roughness:.14,clearcoat:1,clearcoatRoughness:.05,side:THREE.DoubleSide})}
hero=new THREE.Group();ha=new THREE.Mesh(geo,hm(0xe9e9ee));hb=new THREE.Mesh(geo,hm(0xc4161c));hb.rotation.z=Math.PI;hero.add(ha,hb);S.add(hero);
var PN=300;pel=new THREE.InstancedMesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshStandardMaterial({roughness:.3}),PN);
for(i=0;i<PN;i++){pd.push({u:new THREE.Vector3(Math.random()*2-1,Math.random()*2-1,Math.random()*2-1).normalize(),r:Math.random(),s:.04+Math.random()*.07,sp:.2+Math.random()});pel.setColorAt(i,new THREE.Color(i%2?0xe9e9ee:0xd2252b))}
S.add(pel);ready=true;size();requestAnimationFrame(frame);
}
function size(){W=cv.clientWidth||1;H=cv.clientHeight||1;if(R){R.setSize(W,H,false);C.aspect=W/H;C.updateProjectionMatrix()}}
addEventListener('resize',size);
sec.addEventListener('pointermove',function(e){var r=sec.getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5},{passive:true});
addEventListener('scroll',function(){if(run)ui()},{passive:true});ui();
new IntersectionObserver(function(en){run=en[0].isIntersecting;if(run){ui();if(!window.THREE&&!loading)load()}},{rootMargin:'300px'}).observe(sec);
function load(){loading=true;var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=init;document.head.appendChild(s)}
if(window.THREE)init();
function frame(t){
if(ready&&run){
var p=prog();sm+=(p-sm)*(reduce?1:.09);var nar=W<800;
var camZ=L(10,-1,ss(sm/.55)),i;
for(i=0;i<fd.length;i++){var f=fd[i];dm.position.set(f.x,f.y+Math.sin(t/1500+i)*.15,f.z);dm.rotation.set(f.rx+t*.0002*f.sp*3,f.ry+t*.0003*f.sp*3,f.rz);dm.scale.setScalar(f.s);dm.updateMatrix();fw.setMatrixAt(i,dm.matrix);dm.quaternion.multiply(flip);dm.updateMatrix();fr.setMatrixAt(i,dm.matrix)}
fw.instanceMatrix.needsUpdate=true;fr.instanceMatrix.needsUpdate=true;
var gr=ss((sm-.18)/.25),hx=L(0,nar?0:2.4,ss((sm-.58)/.15)),hy=nar?1.3:0,sep=1.05*ss((sm-.64)/.22),hs=(nar?.8:1.35)*gr;
hero.visible=hs>.01;hero.position.set(hx,hy,-7);hero.scale.setScalar(Math.max(.001,hs));
hero.rotation.set(.25+my*.3,.5*Math.sin(t/2200)+mx*.7+(1-gr)*3,L(.9,Math.PI/2,ss((sm-.3)/.3)));
ha.position.y=sep;hb.position.y=-sep;
var pa=ss((sm-.7)/.2),vis=Math.min(1,pa*3),pr=pa*(nar?.6:1);
for(i=0;i<pd.length;i++){var q=pd[i],rad=(.2+pr*(1.2+q.r*3.4))*hs,an=t*.0004*q.sp,ux=q.u.x*Math.cos(an)-q.u.z*Math.sin(an),uz=q.u.x*Math.sin(an)+q.u.z*Math.cos(an);
dm.rotation.set(0,0,0);dm.position.set(hx+ux*rad,hy+q.u.y*rad*.9+Math.sin(t/700*q.sp+i)*.04,-7+uz*rad);dm.scale.setScalar(q.s*vis);dm.updateMatrix();pel.setMatrixAt(i,dm.matrix)}
pel.instanceMatrix.needsUpdate=true;pel.visible=vis>.01;
C.position.set(mx*.9,-my*.6,camZ);C.lookAt(mx*.5,-my*.3,camZ-10);
R.render(S,C)}
if(ready)requestAnimationFrame(frame)}
})();
</script>
<!-- ===== END ERAWAT SCROLL BANNER ===== -->
